<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripSignal | 여행 가격 모니터</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">✈ TripSignal</div>
    <div class="live"><span class="dot"></span> 시연용 실시간 가격</div>
  </header>
  <main>
    <section class="hero">
      <p class="eyebrow">TRAVEL PRICE TRACKER</p>
      <h1>여행 가격 변동 모니터</h1>
      <p class="sub">항공권과 호텔의 시연용 가격이 12초마다 갱신됩니다.</p>
      <div class="status">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">서버에 연결하는 중…</span>
        <span class="sep">·</span>
        <span>갱신 주기 <b>12초</b></span>
      </div>
    </section>
    <section class="summary">
      <div><span class="summary-label">표시 중인 항목</span><strong id="itemCount">—</strong></div>
      <div><span class="summary-label">마지막 갱신</span><strong id="updatedAt">—</strong></div>
    </section>
    <section>
      <div class="section-heading">
        <h2>가격 목록</h2>
        <span class="demo-tag">DEMO DATA</span>
      </div>
      <div id="prices" class="price-grid">
        <div class="loading">가격 정보를 불러오는 중…</div>
      </div>
    </section>
    <p class="notice">안내: 이 페이지의 가격은 서버 운영 및 웹 크롤러 실습을 위한 가상 데이터이며, 실제 판매 가격이 아닙니다.</p>
  </main>
  <footer>TripSignal · 학습용 프로젝트</footer>
  <script src="/app.js"></script>
</body>
</html>
